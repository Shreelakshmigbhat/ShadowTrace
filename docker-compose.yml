services:
  mysql:
    image: mysql:8.0
    container_name: shadowtrace-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # The image creates this NON-ROOT user with ALL privileges on MYSQL_DATABASE only.
      # The Next.js app connects as this user, never as root.
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Binary logging is on by default in MySQL 8; without this flag a non-SUPER user
      # cannot create stored functions. We need that for the advanced SQL files.
      - --log-bin-trust-function-creators=1
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:7
    container_name: shadowtrace-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
